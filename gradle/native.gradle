// The host compiles and runs against ysmlib. Official YSM native is not an input.
// Optional acceleration is selected by ysmlib itself and has a JVM fallback.
tasks.withType(Test).configureEach {
    systemProperty 'ysm.runtime.javaOnly', 'true'
    environment 'YSM_AUDIO_FIXTURE_DIR', providers.environmentVariable('YSM_AUDIO_FIXTURE_DIR')
            .getOrElse(layout.projectDirectory.dir('src/test/resources/audio-contract').asFile.absolutePath)
}
// The default conformance host verifies JVM fallback; native verification is explicit.
afterEvaluate {
    legacyForge.runs.configureEach {
        if (name.startsWith('mockHost')) {
            def accelerated = providers.gradleProperty('ysm.mockNative').getOrElse('false').toBoolean()
            jvmArguments.add('-Dysm.runtime.javaOnly=' + !accelerated)
            if (accelerated) {
                def nativeDir = file(providers.gradleProperty('ysm.mockNativeDir')
                        .getOrElse('runtime/native/build'))
                for (module in ['render', 'codec']) {
                    jvmArguments.add('-Dysm.runtime.' + module + 'Library=' +
                            new File(nativeDir, System.mapLibraryName('ysmlib_' + module)).absolutePath)
                }
            }
        }
    }
}
