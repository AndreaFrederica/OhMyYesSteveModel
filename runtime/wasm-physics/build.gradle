dependencies {
    api project(':ysm-runtime-scene-api')
    implementation 'com.dylibso.chicory:runtime:1.7.5'
    implementation 'com.dylibso.chicory:compiler:1.7.5'
    implementation 'com.dylibso.chicory:wasi:1.7.5'
}
test {
    maxHeapSize = '2g'
    systemProperty 'ysm.runtime.javaOnly', 'true'
    systemProperty 'ysm.runtime.physicsLibrary', 'deliberately-missing-native-physics'
}
tasks.register('physicsBenchmark', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cc.sirrus.ysmlib.scene.physics.wasm.PhysicsBenchmark'
    maxHeapSize = '2g'
    systemProperty 'ysm.runtime.javaOnly', 'true'
}
