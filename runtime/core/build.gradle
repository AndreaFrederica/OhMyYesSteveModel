    implementation project(':ysm-runtime-java-scene')
    implementation project(':ysm-runtime-java-gltf')
    implementation project(':ysm-runtime-java-mmd')
    api project(':ysm-runtime-scene-api')
    implementation project(':ysm-runtime-wasm-physics')
    api project(':ysm-runtime-v3d')
