tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('processorTest', Test) {
    description = 'Runs the extension compatibility annotation processor tests.'
    group = 'verification'
    testClassesDirs = sourceSets.processorTest.output.classesDirs
    classpath = sourceSets.processorTest.runtimeClasspath
}

def modelManagementMockEvidenceDir = providers.gradleProperty(
        'modelManagementMockEvidenceDir')
def modelManagementMockIntentionalFailure = providers.gradleProperty(
        'modelManagementMockIntentionalFailure').map { it.toBoolean() }.orElse(false)
def modelManagementMockImplementationRevision = 21
def modelManagementMockJavaRevision = providers.exec {
    workingDir projectDir
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

tasks.register('modelManagementMockDomain', Test) {
    description = 'Runs model-management domain and workload mock scenarios with evidence output.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'model-management-mock'
    }
    outputs.upToDateWhen { false }

    doFirst {
        def explicitlyConfigured = modelManagementMockEvidenceDir.isPresent()
        def configuredValue = explicitlyConfigured ? modelManagementMockEvidenceDir.get() : null
        if (explicitlyConfigured && !new File(configuredValue).isAbsolute()) {
            throw new GradleException('modelManagementMockEvidenceDir must be absolute')
        }
        def configured = explicitlyConfigured
                ? new File(configuredValue)
                : layout.buildDirectory.dir('model-management-mock/domain').get().asFile

        def evidenceRoot = configured.canonicalFile
        def projectRoot = projectDir.canonicalFile
        def buildRoot = layout.buildDirectory.get().asFile.canonicalFile
        def userHome = new File(System.getProperty('user.home')).canonicalFile
        def fileSystemRoot = evidenceRoot.toPath().root.toFile().canonicalFile
        if (evidenceRoot == fileSystemRoot || evidenceRoot == userHome ||
                evidenceRoot == projectRoot || evidenceRoot == buildRoot ||
                projectRoot.toPath().startsWith(evidenceRoot.toPath()) ||
                userHome.toPath().startsWith(evidenceRoot.toPath())) {
            throw new GradleException("Refusing unsafe evidence directory: ${evidenceRoot}")
        }
        if (!explicitlyConfigured && !evidenceRoot.toPath().startsWith(buildRoot.toPath())) {
            throw new GradleException("Default evidence directory escaped build/: ${evidenceRoot}")
        }

        def marker = new File(evidenceRoot, '.ysm-model-management-evidence')
        def underBuild = evidenceRoot.toPath().startsWith(buildRoot.toPath())
        if (evidenceRoot.exists() && evidenceRoot.listFiles()?.length > 0 &&
                !underBuild && !marker.isFile()) {
            throw new GradleException(
                    "Refusing non-empty unmarked evidence directory: ${evidenceRoot}")
        }

        delete evidenceRoot
        mkdir evidenceRoot
        java.nio.file.Files.writeString(marker.toPath(), 'model-management-mock\n')
        systemProperty 'ysm.mock.evidenceRoot', evidenceRoot.absolutePath
        systemProperty 'ysm.mock.javaRevision', modelManagementMockJavaRevision.get()
        systemProperty 'ysm.mock.startedAt', java.time.Instant.now().toString()
        systemProperty 'ysm.mock.implementationRevision',
                modelManagementMockImplementationRevision.toString()
        systemProperty 'ysm.mock.command',
                "./gradlew modelManagementMockDomain${explicitlyConfigured ? " -PmodelManagementMockEvidenceDir=${evidenceRoot.absolutePath}" : ''}${modelManagementMockIntentionalFailure.get() ? ' -PmodelManagementMockIntentionalFailure=true' : ''}"
        systemProperty 'ysm.mock.intentionalFailure',
                modelManagementMockIntentionalFailure.get().toString()
    }
}

def modelManagementMockForgeEvidenceDir = providers.gradleProperty(
        'modelManagementMockForgeEvidenceDir')
def modelManagementMockFinalEvidenceDir = providers.gradleProperty(
        'modelManagementMockFinalEvidenceDir')

def validateMockEvidenceRoot = { File configured, boolean explicitlyConfigured ->
    def evidenceRoot = configured.canonicalFile
    def projectRoot = projectDir.canonicalFile
    def buildRoot = layout.buildDirectory.get().asFile.canonicalFile
    def userHome = new File(System.getProperty('user.home')).canonicalFile
    def fileSystemRoot = evidenceRoot.toPath().root.toFile().canonicalFile
    if (evidenceRoot == fileSystemRoot || evidenceRoot == userHome ||
            evidenceRoot == projectRoot || evidenceRoot == buildRoot ||
            projectRoot.toPath().startsWith(evidenceRoot.toPath()) ||
            userHome.toPath().startsWith(evidenceRoot.toPath())) {
        throw new GradleException("Refusing unsafe evidence directory: ${evidenceRoot}")
    }
    if (!explicitlyConfigured && !evidenceRoot.toPath().startsWith(buildRoot.toPath())) {
        throw new GradleException("Default evidence directory escaped build/: ${evidenceRoot}")
    }
    def marker = new File(evidenceRoot, '.ysm-model-management-evidence')
    def underBuild = evidenceRoot.toPath().startsWith(buildRoot.toPath())
    if (evidenceRoot.exists() && evidenceRoot.listFiles()?.length > 0 &&
            !underBuild && !marker.isFile()) {
        throw new GradleException(
                "Refusing non-empty unmarked evidence directory: ${evidenceRoot}")
    }
    return evidenceRoot
}

def productionArchives = providers.provider {
    [tasks.named('jar').get().archiveFile.get().asFile,
     tasks.named('reobfJar').get().archiveFile.get().asFile,
     tasks.named('shadowJar').get().archiveFile.get().asFile]
}

tasks.register('verifyMockHostPackaging') {
    description = 'Verifies mock-only classes and resources are absent from release archives.'
    group = 'verification'
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
    inputs.files(productionArchives)
    doLast {
        def forbidden = [
                'com/elfmcys/ysm/mock/host/',
                'com/elfmcys/ysm/mock/supervisor/',
                'com/elfmcys/ysm/mock/evidence/',
                'com/elfmcys/ysm/mock/classpath/',
                'com/elfmcys/ysm/network/forge/MockClientEndpoint',
                'com/elfmcys/ysm/network/forge/MockServerEndpoint',
                'log4j2-mock-smoke.xml'
        ]
        productionArchives.get().each { archive ->
            def leaked = zipTree(archive).matching {
                forbidden.each { prefix -> include "${prefix}**" }
            }.files
            if (!leaked.isEmpty()) {
                throw new GradleException(
                        "Verification-only classes leaked into ${archive}: ${leaked}")
            }
        }
    }
}

