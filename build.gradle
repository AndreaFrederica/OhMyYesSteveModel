def playgroundMainClass = providers.gradleProperty('playgroundMainClass')
        .orElse('com.elfmcys.ysm.playground.Playground')

tasks.register('runPlayground', JavaExec) {
    group = 'application'
    description = 'Runs the playground main class from the test source set.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = playgroundMainClass
}

jar {
    manifest.attributes([
            "Implementation-Title"  : project.name,
            "Implementation-Version": "${version}",
            "MixinConfigs"          : "ysm.mixins.json",
            "FMLAT"                 : "ysm_at.cfg",
            "ModType"               : "CRL"
    ])
    archiveClassifier = "raw"
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

def reobfJarTask = tasks.named('reobfJar')
reobfJarTask.configure {
    archiveClassifier = 'reobf'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
// Shadow adds the development-mapped main output by default; reobfJar must be the only mod source.
def developmentMainOutput = sourceSets.main.output.files.collect {
    it.toPath().toAbsolutePath().normalize()
}

tasks.named('shadowJar') {
    dependsOn reobfJarTask
    dependsOn relocateProcessorAsmTask
    from(reobfJarTask.flatMap { it.archiveFile }.map { archive ->
        project.zipTree(archive.asFile)
    })
    from(relocateProcessorAsmTask.flatMap { it.archiveFile }.map { archive ->
        project.zipTree(archive.asFile)
    })
    configurations = [project.configurations.ysmImplementation]
    archiveClassifier = ''
    exclude { entry ->
        def entryPath = entry.file.toPath().toAbsolutePath().normalize()
        developmentMainOutput.any { entryPath.startsWith(it) }
    }
    exclude '**/*.proto'
    exclude '/META-INF/maven/**'
    exclude '/META-INF/native-image/*'
    exclude '/META-INF/proguard/*'
    relocate 'us.hebi.quickbuf', 'com.elfmcys.quickbuf'
    relocate 'mixel', 'com.elfmcys.mixel'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-Xlint:-removal',
            '-parameters'
    ]
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
