buildscript {
    repositories {
        maven { url = "https://plugins.gradle.org/m2/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext:1.2'
    }
}

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.mcpforge' version '2.0.185-legacy'
    id 'com.google.protobuf' version '0.9.4'
    id 'com.gradleup.shadow' version '9.4.1'
}

apply plugin: 'org.jetbrains.gradle.plugin.idea-ext'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

apply from: 'gradle/local-properties.gradle'
apply from: 'gradle/native.gradle'
apply from: 'gradle/fast-run.gradle'
apply from: 'gradle/schema.gradle'
apply from: 'gradle/builtin-index.gradle'

version = mod_version
group = 'com.elfmcys.ysm'
base.archivesName = 'ysm'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withJavadocJar()
}

sourceSets {
    mockSupport
    mockCommon {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath +
                sourceSets.mockSupport.output
    }
    mockClient {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath +
                sourceSets.mockSupport.output + sourceSets.mockCommon.output
    }
    mockServer {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath +
                sourceSets.mockSupport.output + sourceSets.mockCommon.output
    }
    mockHost {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    mockSupervisor {
        compileClasspath += sourceSets.mockSupport.output
        runtimeClasspath += output + sourceSets.mockSupport.output
    }
}

neoFormRuntime {
    version = '2.0.52-legacy'
}

mcpForge {
    enable {
        cleanroomVersion = '0.6.13-alpha'
        mcpMappings = 'de.oceanlabs.mcp:mcp_stable:39-1.12@zip'
    }

    accessTransformers.from('src/main/resources/META-INF/ysm_at.cfg')

    mods {
        ysm {
            sourceSet sourceSets.main
        }
        ysmMockHost {
            sourceSet sourceSets.mockHost
        }
    }

    runs {
        configureEach {
            //logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments = [
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ]
        }

        client {
            client()
            gameDirectory = project.file('run/client_a')
            loadedMods = [mods.ysm]
        }

        client2 {
            client()
            gameDirectory = project.file('run/client_b')
            programArguments = ["--username", "tartaric_acid"]
            loadedMods = [mods.ysm]
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            loadedMods = [mods.ysm]
        }

        mockHostClientA {
            client()
            sourceSet = sourceSets.mockHost
            gameDirectory = layout.buildDirectory.dir('model-management-mock/unused/client-a')
            programArguments = ["--username", "YsmHostA",
                                "--mixin.config", "ysm.mixins.json"]
            loadedMods = [mods.ysm, mods.ysmMockHost]
            disableIdeRun()
        }

        mockHostClientB {
            client()
            sourceSet = sourceSets.mockHost
            gameDirectory = layout.buildDirectory.dir('model-management-mock/unused/client-b')
            programArguments = ["--username", "YsmHostB",
                                "--mixin.config", "ysm.mixins.json"]
            loadedMods = [mods.ysm, mods.ysmMockHost]
            disableIdeRun()
        }

        mockHostServer {
            server()
            sourceSet = sourceSets.mockHost
            gameDirectory = layout.buildDirectory.dir('model-management-mock/unused/server')
            programArguments = ["--mixin.config", "ysm.mixins.json"]
            loadedMods = [mods.ysm, mods.ysmMockHost]
            disableIdeRun()
        }
    }

    addModdingDependenciesTo sourceSets.mockHost
}

mixin {
    add sourceSets.main, "ysm.refmap.json"
    config "ysm.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    processorTest {
        java.srcDir 'src/processorTest/java'
        compileClasspath += sourceSets.main.output.classesDirs
        runtimeClasspath += output + compileClasspath + files('src/main/resources')
    }
}

processResources {
    inputs.property "mod_version", project.version
    filteringCharset "UTF-8"

    from("LICENSE")
    from("NOTICE.md")

    filesMatching("mcmod.info") {
        expand "mod_version": project.version
    }
}

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Cleanroom Maven"
        url = "https://repo.cleanroommc.com/releases"
        content {
            includeGroup "com.cleanroommc"
        }
    }
    maven {
        name = "Cleanroom Curse Maven"
        url = "https://curse.cleanroommc.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Mod Maven"
        url = "https://modmaven.dev"
        content {
            includeGroup "mcjty.theoneprobe"
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup "tschipp.carryon"
        }
    }
    maven {
        // Add jitpack to repositories
        url 'https://jitpack.io'
        content {
            excludeGroup 'com.google.protobuf'
            excludeGroup 'us.hebi.quickbuf'
        }
    }
//    maven {
//        name = "Curios"
//        url = uri("https://maven.theillusivec4.top/")
//    }
}

configurations {
    processorAsm {
        canBeConsumed = false
        canBeResolved = true
    }
    ysmImplementation
    implementation.extendsFrom ysmImplementation
    additionalRuntimeClasspath.extendsFrom ysmImplementation
}

