tasks.register('modelManagementMockSupervisorTest', Test) {
    description = 'Runs the process-supervisor lifecycle and exact-cleanup self-tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.elfmcys.ysm.mock.supervisor.ProcessSupervisorTest'
        includeTestsMatching 'com.elfmcys.ysm.mock.supervisor.MockExact100VerifierTest'
        includeTestsMatching 'com.elfmcys.ysm.mock.supervisor.FinalClosureSupervisorTest'
    }
}

tasks.register('modelManagementMockSmoke', JavaExec) {
    description = 'Runs the side-specific ordinary-JVM model-management classpath smoke.'
    group = 'verification'
    dependsOn tasks.named('mockClientClasses')
    dependsOn tasks.named('mockServerClasses')
    dependsOn tasks.named('mockSupervisorClasses')
    dependsOn tasks.named('modelManagementMockSupervisorTest')
    dependsOn tasks.named('verifyMockHostPackaging')
    classpath = sourceSets.mockSupervisor.runtimeClasspath
    mainClass = 'com.elfmcys.ysm.mock.supervisor.MockSupervisor'
    outputs.upToDateWhen { false }

    doFirst {
        if (!modelManagementMockTaskRoot.isPresent()) {
            throw new GradleException(
                    'modelManagementMockTaskRoot must identify the absolute frozen task package')
        }
        def taskRoot = new File(modelManagementMockTaskRoot.get()).canonicalFile
        if (!taskRoot.isAbsolute() || !new File(taskRoot, 'contract/overview.md').isFile()) {
            throw new GradleException(
                    "Invalid modelManagementMockTaskRoot: ${taskRoot}")
        }

        def explicitlyConfigured = modelManagementMockSystemEvidenceDir.isPresent()
        def configuredValue = explicitlyConfigured
                ? modelManagementMockSystemEvidenceDir.get() : null
        if (explicitlyConfigured && !new File(configuredValue).isAbsolute()) {
            throw new GradleException(
                    'modelManagementMockSystemEvidenceDir must be absolute')
        }
        def configured = explicitlyConfigured
                ? new File(configuredValue)
                : layout.buildDirectory.dir('model-management-mock/classpath-smoke')
                .get().asFile
        def evidenceRoot = validateMockEvidenceRoot(configured, explicitlyConfigured)
        delete evidenceRoot
        mkdir evidenceRoot
        java.nio.file.Files.writeString(
                new File(evidenceRoot, '.ysm-model-management-evidence').toPath(),
                'model-management-mock\n')

        def writeClasspath = { String name, FileCollection classpathFiles ->
            def target = new File(evidenceRoot, name)
            def entries = new LinkedHashSet<String>()
            classpathFiles.files.findAll { it.exists() }.each {
                entries.add(it.canonicalPath)
            }
            java.nio.file.Files.writeString(target.toPath(),
                    entries.join('\n') + '\n', java.nio.charset.StandardCharsets.UTF_8)
            target
        }
